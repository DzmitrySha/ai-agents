# Plaintext allowlist (credentials only). НЕ коммитить с реальными значениями.
# Workflow:
#   1) cp ai-agents-secret.example.yaml ai-agents-secret.enc.yaml
#   2) заполнить CHANGE_ME
#   3) sops -e -i infra/k8s/ai-agents-secret.enc.yaml
#   4) commit только encrypted enc
apiVersion: v1
kind: Secret
metadata:
  name: ai-agents-secret
  namespace: ai-agents
type: Opaque
stringData:
  SERVICE_API_KEYS: "CHANGE_ME_SERVICE_KEY"
  # Optional default LLM key for a remote OpenAI-compatible endpoint.
  DEFAULT_LLM_API_KEY: "CHANGE_ME"
  # Keycloak confidential client secret (realm ai-agents, client ai-agents).
  KEYCLOAK_CLIENT_SECRET: "CHANGE_ME"
  # BFF session cookie signer — long random string.
  SESSION_SECRET_KEY: "CHANGE_ME_LONG_RANDOM"
  # Langfuse tracing (optional, empty = off).
  LANGFUSE_PUBLIC_KEY: ""
  LANGFUSE_SECRET_KEY: ""
  DATABASE_URL: "postgresql+asyncpg://postgres:CHANGE_ME@neuro-host.example.com:5432/ai_agents"

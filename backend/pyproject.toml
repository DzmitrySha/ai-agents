[project]
name = "ai-agents-backend"
version = "0.1.0"
description = "ai-agents agent runtime — FastAPI + LangGraph, API-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "httpx>=0.28.0",
  "httpx2>=2.16,<3",
  "loguru>=0.7.0",
  "langgraph>=0.2.60",
  "langchain-openai>=0.2.14",
  "langchain-core>=0.3.28",
  "authlib>=1.3.0",
  "itsdangerous>=2.2.0",
  "langfuse>=3,<4",
  "langchain>=0.3,<1",
  "mcp>=2.3,<3",
  "tzdata>=2024.1",
  "croniter>=6.2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.28.0",
  "httpx2>=2.16,<3",
  "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
